name: Release

on:
  push:
    tags:
      - "*.*.*"
  # 手动触发（分支验证打包链路用；Release 上传仅限 tag）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macos：zip / zxp / mac pkg（arm64 + x64 双架构，runtime 交叉构建）
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 仓库是 yarn.lock（无 package-lock.json），npm ci 不可用
      - run: npm install --legacy-peer-deps

      # ZIP 安装包（未签名，配合 PlayerDebugMode 使用）→ dist/cep/ + dist/zxp/
      - run: npm run zip
        env:
          NODE_ENV: production

      # 两种安装形态：
      #   RocX-CEP_*.zip   = 扩展文件夹（解压到 CEP extensions 目录 + PlayerDebugMode）
      #   com.rocx.cep.zxp = ZXP 安装包（ZXP Installer 拖装）
      - name: Package extension folder
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release/com.rocx.cep
          cp -R dist/cep/. release/com.rocx.cep/
          (cd release && zip -rq "../RocX-CEP_${VERSION}.zip" com.rocx.cep)
          cp dist/zxp/com.rocx.cep.zxp .

      # 内嵌 runtime 的 mac pkg：双击安装（扩展 + runtime + PlayerDebugMode）
      - name: Build darwin-arm64 runtime
        run: node scripts/build-runtime.mjs --platform darwin-arm64 --out build/runtime/darwin-arm64

      - name: Build darwin-x64 runtime
        run: node scripts/build-runtime.mjs --platform darwin-x64 --out build/runtime/darwin-x64

      - name: Build mac pkgs
        run: |
          packagers/mac/build-pkg.sh --arch arm64
          packagers/mac/build-pkg.sh --arch x64

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            RocX-CEP_*.zip
            com.rocx.cep.zxp
            build/pkg/*.pkg
          generate_release_notes: true

      # 手动跑（非 tag）时用 artifact 拿产物验证
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: macos-dist
          path: |
            RocX-CEP_*.zip
            com.rocx.cep.zxp
            build/pkg/*.pkg

  # windows：exe 安装包（Inno Setup per-user 免管理员）
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --legacy-peer-deps

      # exe 只需要 dist/cep（面板产物）
      - run: npm run build
        env:
          NODE_ENV: production

      - name: Build win-x64 runtime
        shell: bash
        run: node scripts/build-runtime.mjs --platform win-x64 --out build/runtime/win-x64

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: >
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.version }}
          packagers\win\rocx.iss

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/exe/*.exe
          generate_release_notes: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: windows-dist
          path: build/exe/*.exe
